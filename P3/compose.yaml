services:
  app:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CHROMA_DB_DIR: /app/chroma_db
    volumes:
      - ./documents:/app/documents:ro
      - chroma_data:/app/chroma_db
    restart: unless-stopped

volumes:
  chroma_data:
